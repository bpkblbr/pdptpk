<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Pendataan Keluarga Terpadu</title>
  <!-- Tailwind CSS CDN untuk tampilan modern & responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 sm:p-8">

  <div class="max-w-5xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
    <!-- Header -->
    <header class="bg-emerald-700 text-white p-6 sm:p-8">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Formulir Pendataan Keluarga</h1>
      <p class="text-emerald-100 mt-2 text-sm sm:text-base">
        Input Terpadu Anggota Keluarga, Blok KB, dan Lingkungan / Pembangunan Keluarga
      </p>
    </header>

    <form id="pendataanForm" class="p-6 sm:p-8 space-y-8">
      
      <!-- ================= 1. INFORMASI KELUARGA & WILAYAH ================= -->
      <section class="border-b border-slate-200 pb-6">
        <h2 class="text-lg font-semibold text-emerald-800 border-l-4 border-emerald-600 pl-3 mb-4">
          I. Informasi Kartu Keluarga & Wilayah
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomor Kartu Keluarga (KK) *</label>
            <input type="text" id="nomor_kk" required maxlength="16" placeholder="Contoh: 5201081234560001"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode Dusun *</label>
            <input type="text" id="kode_dusun" required placeholder="Contoh: 52.01.08.2001.001"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">RT / RW</label>
            <input type="text" id="rt" placeholder="Contoh: 002/001"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div class="sm:col-span-2 md:col-span-3">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Alamat Rumah Lengkap</label>
            <textarea id="alamat_detail" rows="2" placeholder="Nama Jalan / Patokan Tempat Tinggal"
                      class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>
        </div>
      </section>

      <!-- ================= 2. DAFTAR ANGGOTA KELUARGA ================= -->
      <section class="border-b border-slate-200 pb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-emerald-800 border-l-4 border-emerald-600 pl-3">
            II. Data Anggota Keluarga
          </h2>
          <button type="button" id="btnTambahAnggota"
                  class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2 px-3 rounded-lg shadow transition">
            + Tambah Anggota
          </button>
        </div>

        <div id="containerAnggota" class="space-y-4">
          <!-- Item anggota keluarga akan di-render di sini lewat JavaScript -->
        </div>
      </section>

      <!-- ================= 3. BLOK KB (PUS 10-49 TAHUN) ================= -->
      <section class="border-b border-slate-200 pb-6">
        <h2 class="text-lg font-semibold text-emerald-800 border-l-4 border-emerald-600 pl-3 mb-4">
          III. Keluarga Berencana (Khusus Pasangan Usia Subur)
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Apakah Saat Ini Sedang Hamil?</label>
            <select id="sedang_hamil" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="false">Tidak</option>
              <option value="true">Ya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Usia Kehamilan (Minggu)</label>
            <input type="number" id="usia_kehamilan_minggu" min="0" max="45" placeholder="0 jika tidak hamil"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Sedang Menggunakan Alat/Obat KB?</label>
            <select id="sedang_pakai_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="true">Ya</option>
              <option value="false">Tidak</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kontrasepsi yang Dipakai</label>
            <select id="kode_jenis_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="">-- Pilih Jenis KB --</option>
              <option value="1">1. MOW / Steril Wanita</option>
              <option value="2">2. MOP / Steril Pria</option>
              <option value="3">3. IUD / Spiral</option>
              <option value="4">4. Implan / Susuk</option>
              <option value="5">5. Suntik</option>
              <option value="6">6. Pil</option>
              <option value="7">7. Kondom</option>
              <option value="8">8. MAL</option>
              <option value="9">9. Tradisional</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jika Tidak Ber-KB, Alasan Utama:</label>
            <select id="kode_alasan_tidak_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="">-- Pilih Alasan --</option>
              <option value="1">1. Ingin Hamil/Anak</option>
              <option value="2">2. Tidak Tahu Tentang KB</option>
              <option value="3">3. Alasan Kesehatan</option>
              <option value="4">4. Takut Efek Samping</option>
              <option value="7">7. Biaya Mahal</option>
              <option value="9">9. Suami/Keluarga Menolak</option>
              <option value="10">10. Alasan Agama</option>
              <option value="13">13. Infertilitas / Menopause</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jumlah Anak Hidup (Laki-laki / Perempuan)</label>
            <div class="flex gap-2">
              <input type="number" id="jml_anak_laki" placeholder="L" min="0" class="w-1/2 px-3 py-2 border rounded-lg" />
              <input type="number" id="jml_anak_perempuan" placeholder="P" min="0" class="w-1/2 px-3 py-2 border rounded-lg" />
            </div>
          </div>
        </div>
      </section>

      <!-- ================= 4. KONDISI RUMAH / LINGKUNGAN ================= -->
      <section class="border-b border-slate-200 pb-6">
        <h2 class="text-lg font-semibold text-emerald-800 border-l-4 border-emerald-600 pl-3 mb-4">
          IV. Kondisi Rumah & Lingkungan Fisik
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">19. Jenis Atap Terluas</label>
            <select id="kode_atap" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1">1. Beton</option>
              <option value="2" selected>2. Genteng</option>
              <option value="3">3. Asbes/Seng</option>
              <option value="4">4. Kayu/Sirap</option>
              <option value="5">5. Bambu</option>
              <option value="6">6. Jerami/Ijuk</option>
              <option value="7">7. Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">20. Jenis Dinding Terluas</label>
            <select id="kode_dinding" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1" selected>1. Tembok</option>
              <option value="2">2. Kayu/Papan</option>
              <option value="3">3. Seng</option>
              <option value="4">4. Bambu</option>
              <option value="5">5. Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">21. Jenis Lantai Terluas</label>
            <select id="kode_lantai" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1" selected>1. Keramik / Granit / Ubin</option>
              <option value="2">2. Semen</option>
              <option value="3">3. Kayu / Papan</option>
              <option value="4">4. Bambu</option>
              <option value="5">5. Tanah</option>
              <option value="6">6. Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">23. Sumber Air Minum Utama</label>
            <select id="kode_air_minum" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1">1. Air Kemasan / Isi Ulang</option>
              <option value="2" selected>2. Ledeng / PDAM</option>
              <option value="3">3. Sumur Bor</option>
              <option value="4">4. Sumur Terlindung</option>
              <option value="5">5. Sumur Tidak Terlindung</option>
              <option value="6">6. Air Sungai / Danau</option>
              <option value="7">7. Air Hujan</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">24. Fasilitas Tempat Buang Air Besar</label>
            <select id="kode_jamban" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1" selected>1. Ya, dengan Septic Tank</option>
              <option value="2">2. Ya, tanpa Septic Tank</option>
              <option value="3">3. Jamban Umum / Bersama</option>
              <option value="4">4. Tidak Ada / Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">28. Status Kepemilikan Rumah</label>
            <select id="kode_kepemilikan_rumah" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="1" selected>1. Milik Sendiri</option>
              <option value="2">2. Kontrak / Sewa</option>
              <option value="3">3. Bebas Sewa</option>
              <option value="4">4. Menumpang</option>
              <option value="5">5. Rumah Dinas</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Tombol Submit -->
      <div class="flex items-center justify-end gap-3 pt-4">
        <button type="reset" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 transition text-sm">
          Reset Form
        </button>
        <button type="submit" id="btnSimpan"
                class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-md transition text-sm flex items-center">
          <span>Simpan Seluruh Data</span>
        </button>
      </div>

    </form>
  </div>

  <!-- SCRIPT LOGIKA FORM & SUPABASE -->
  <script>
    // ==========================================
    // 1. KONFIGURASI SUPABASE
    // Ganti nilai di bawah dengan URL & Kunci API Supabase Anda
    // ==========================================
    const SUPABASE_URL = "https://PROJECT_ID_ANDA.supabase.co";
    const SUPABASE_ANON_KEY = "MASUKKAN_ANON_PUBLIC_KEY_ANDA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let nomorUrutAnggota = 1;

    // Template Baris Anggota Keluarga
    function buatBarisAnggota(urutan) {
      const wrapper = document.createElement('div');
      wrapper.className = "p-4 border border-slate-200 rounded-xl bg-slate-50 relative space-y-3 item-anggota";
      wrapper.innerHTML = `
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-xs font-bold uppercase text-emerald-800">Anggota Ke-#${urutan}</span>
          ${urutan > 1 ? `<button type="button" onclick="this.closest('.item-anggota').remove()" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Hapus</button>` : ''}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs">
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Nama Lengkap *</label>
            <input type="text" name="nama_lengkap" required placeholder="Nama Sesuai KTP" class="w-full p-2 border rounded-md" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">NIK *</label>
            <input type="text" name="nik" required maxlength="16" placeholder="16 Digit NIK" class="w-full p-2 border rounded-md" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Hubungan dg KK</label>
            <select name="hubungan_dengan_kk" class="w-full p-2 border rounded-md">
              <option value="1" ${urutan === 1 ? 'selected' : ''}>1. Kepala Keluarga</option>
              <option value="2" ${urutan === 2 ? 'selected' : ''}>2. Istri</option>
              <option value="3" ${urutan > 2 ? 'selected' : ''}>3. Anak</option>
              <option value="4">4. Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Jenis Kelamin</label>
            <select name="jenis_kelamin" class="w-full p-2 border rounded-md">
              <option value="1">1. Laki-laki</option>
              <option value="2">2. Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Tanggal Lahir</label>
            <input type="date" name="tanggal_lahir" required class="w-full p-2 border rounded-md" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Status Kawin</label>
            <select name="status_perkawinan" class="w-full p-2 border rounded-md">
              <option value="1">1. Belum Kawin</option>
              <option value="2">2. Kawin</option>
              <option value="3">3. Cerai Hidup</option>
              <option value="4">4. Cerai Mati</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Memiliki Akta Lahir</label>
            <select name="memiliki_akta_lahir" class="w-full p-2 border rounded-md">
              <option value="1">1. Ya</option>
              <option value="2">2. Tidak</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">Jaminan Kesehatan (JKN)</label>
            <select name="kepesertaan_jkn" class="w-full p-2 border rounded-md">
              <option value="1">1. BPJS PBI</option>
              <option value="2">2. BPJS Non-PBI</option>
              <option value="3">3. Swasta</option>
              <option value="4">4. Tidak Memiliki</option>
            </select>
          </div>
        </div>
      `;
      return wrapper;
    }

    // Inisialisasi awal baris Kepala Keluarga
    const containerAnggota = document.getElementById('containerAnggota');
    containerAnggota.appendChild(buatBarisAnggota(nomorUrutAnggota));

    document.getElementById('btnTambahAnggota').addEventListener('click', () => {
      nomorUrutAnggota++;
      containerAnggota.appendChild(buatBarisAnggota(nomorUrutAnggota));
    });

    // Handle Submit
    document.getElementById('pendataanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSimpan = document.getElementById('btnSimpan');
      btnSimpan.disabled = true;
      btnSimpan.innerText = "Menyimpan Data...";

      try {
        const noKK = document.getElementById('nomor_kk').value.trim();
        const kdDusun = document.getElementById('kode_dusun').value.trim();
        const rt = document.getElementById('rt').value.trim();
        const alamat = document.getElementById('alamat_detail').value.trim();

        // 1. Ekstrak Semua Anggota Keluarga
        const items = document.querySelectorAll('.item-anggota');
        const daftarAnggota = [];

        items.forEach((item, index) => {
          daftarAnggota.push({
            nomor_kk: noKK,
            kode_dusun: kdDusun,
            rt: rt,
            alamat_detail: alamat,
            nomor_urut_anggota: index + 1,
            nama_lengkap: item.querySelector('[name="nama_lengkap"]').value.trim(),
            nik: item.querySelector('[name="nik"]').value.trim(),
            jenis_kelamin: item.querySelector('[name="jenis_kelamin"]').value,
            tanggal_lahir: item.querySelector('[name="tanggal_lahir"]').value,
            status_perkawinan: item.querySelector('[name="status_perkawinan"]').value,
            memiliki_akta_lahir: item.querySelector('[name="memiliki_akta_lahir"]').value,
            hubungan_dengan_kk: item.querySelector('[name="hubungan_dengan_kk"]').value,
            agama: '1', // default Islam atau sesuaikan dropdown
            status_pekerjaan: '1',
            pendidikan_terakhir: '4',
            kepesertaan_jkn: item.querySelector('[name="kepesertaan_jkn"]').value,
            keberadaan_anggota: '1'
          });
        });

        // 2. Simpan Anggota Keluarga ke Supabase
        // Karena ada Database Trigger, tabel kartu_keluarga otomatis terbuat
        const { error: errAnggota } = await supabaseClient
          .from('anggota_keluarga')
          .insert(daftarAnggota);

        if (errAnggota) throw errAnggota;

        // 3. Update Kondisi Lingkungan/Rumah di kartu_keluarga
        const dataRumah = {
          kode_atap: document.getElementById('kode_atap').value,
          kode_dinding: document.getElementById('kode_dinding').value,
          kode_lantai: document.getElementById('kode_lantai').value,
          kode_air_minum: document.getElementById('kode_air_minum').value,
          kode_jamban: document.getElementById('kode_jamban').value,
          kode_kepemilikan_rumah: document.getElementById('kode_kepemilikan_rumah').value,
          diperbarui_pada: new Date()
        };

        const { data: kkData, error: errKkUpdate } = await supabaseClient
          .from('kartu_keluarga')
          .update(dataRumah)
          .eq('nomor_kk', noKK)
          .select('id')
          .single();

        if (errKkUpdate) throw errKkUpdate;

        // 4. Simpan Data Blok KB
        const dataKB = {
          kartu_keluarga_id: kkData.id,
          sedang_hamil: document.getElementById('sedang_hamil').value === 'true',
          usia_kehamilan_minggu: parseInt(document.getElementById('usia_kehamilan_minggu').value) || 0,
          sedang_pakai_kb: document.getElementById('sedang_pakai_kb').value === 'true',
          kode_jenis_kb: document.getElementById('kode_jenis_kb').value || null,
          kode_alasan_tidak_kb: document.getElementById('kode_alasan_tidak_kb').value || null,
          jml_anak_masih_hidup_laki: parseInt(document.getElementById('jml_anak_laki').value) || 0,
          jml_anak_masih_hidup_perempuan: parseInt(document.getElementById('jml_anak_perempuan').value) || 0
        };

        const { error: errKB } = await supabaseClient
          .from('keluarga_berencana_pus')
          .insert([dataKB]);

        if (errKB) throw errKB;

        alert('Data keluarga, anggota, KB, dan perumahan berhasil disimpan!');
        document.getElementById('pendataanForm').reset();
        containerAnggota.innerHTML = '';
        nomorUrutAnggota = 1;
        containerAnggota.appendChild(buatBarisAnggota(1));

      } catch (err) {
        console.error(err);
        alert('Gagal menyimpan data: ' + (err.message || JSON.stringify(err)));
      } finally {
        btnSimpan.disabled = false;
        btnSimpan.innerText = "Simpan Seluruh Data";
      }
    });
  </script>
</body>
</html>
