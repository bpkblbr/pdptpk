<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Pendataan Keluarga Terpadu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    input[type="text"], textarea, select {
      text-transform: uppercase;
    }
    .halaman-form {
      display: none;
    }
    .halaman-form.aktif {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-3 sm:p-8 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-4xl bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200">
    
    <!-- Header & Indikator Halaman -->
    <header class="bg-emerald-700 text-white p-6 sm:p-8">
      <div class="flex justify-between items-center mb-2">
        <span id="badgeLangkah" class="bg-emerald-900/60 text-emerald-200 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
          LANGKAH 1
        </span>
        <span id="labelTotalTahap" class="text-xs text-emerald-200 font-bold uppercase">
          IDENTITAS WILAYAH
        </span>
      </div>
      <h1 class="text-xl sm:text-2xl font-black uppercase tracking-wide">FORMULIR PENDATAAN KELUARGA</h1>
      <p class="text-emerald-100 text-xs sm:text-sm mt-1">Sistem Input Terpadu Registrasi & Potensi Keluarga</p>
    </header>

    <form id="pendataanForm" class="p-6 sm:p-8">
      
      <!-- ========================================================
           HALAMAN 1: I. IDENTITAS WILAYAH
           ======================================================== -->
      <div id="hal_wilayah" class="halaman-form aktif space-y-6">
        <h2 class="text-lg font-bold text-emerald-800 border-l-4 border-emerald-600 pl-3 uppercase">
          I. IDENTITAS WILAYAH
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <!-- NO. KK -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">NO. KK *</label>
            <input type="text" id="nomor_kk" required maxlength="16" placeholder="16 DIGIT NOMOR KK"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 font-semibold outline-none uppercase" />
          </div>

          <!-- PROVINSI -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">PROVINSI *</label>
            <select id="provinsi" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH PROVINSI --</option>
            </select>
          </div>

          <!-- KODE PROVINSI -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KODE PROVINSI</label>
            <input type="text" id="kode_provinsi" readonly placeholder="OTOMATIS"
                   class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-slate-600 font-bold outline-none uppercase" />
          </div>

          <!-- KABUPATEN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KABUPATEN *</label>
            <select id="kabupaten" required disabled class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH KABUPATEN --</option>
            </select>
          </div>

          <!-- KODE KABUPATEN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KODE KABUPATEN</label>
            <input type="text" id="kode_kabupaten" readonly placeholder="OTOMATIS"
                   class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-slate-600 font-bold outline-none uppercase" />
          </div>

          <!-- KECAMATAN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KECAMATAN *</label>
            <select id="kecamatan" required disabled class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH KECAMATAN --</option>
            </select>
          </div>

          <!-- KODE KECAMATAN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KODE KECAMATAN</label>
            <input type="text" id="kode_kecamatan" readonly placeholder="OTOMATIS"
                   class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-slate-600 font-bold outline-none uppercase" />
          </div>

          <!-- DESA -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">DESA *</label>
            <select id="desa" required disabled class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH DESA --</option>
            </select>
          </div>

          <!-- KODE DESA -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KODE DESA</label>
            <input type="text" id="kode_desa" readonly placeholder="OTOMATIS"
                   class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-slate-600 font-bold outline-none uppercase" />
          </div>

          <!-- DUSUN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">DUSUN *</label>
            <select id="dusun" required disabled class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH DUSUN --</option>
            </select>
          </div>

          <!-- KODE DUSUN -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">KODE DUSUN</label>
            <input type="text" id="kode_dusun" readonly placeholder="OTOMATIS"
                   class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-slate-600 font-bold outline-none uppercase" />
          </div>

          <!-- RT (GENERATED DINAMIS) -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">RT *</label>
            <select id="rt" required disabled class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase font-bold">
              <option value="">-- PILIH RT --</option>
            </select>
          </div>

          <!-- ALAMAT DETAIL -->
          <div class="sm:col-span-2 md:col-span-3">
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ALAMAT DETAIL *</label>
            <input type="text" id="alamat_detail" required placeholder="NAMA JALAN / GANG / NOMOR RUMAH"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase" />
          </div>

          <!-- NO. TELP / HP (SETELAH ALAMAT) -->
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">NO. HP / WA *</label>
            <input type="text" id="no_hp" required placeholder="08XXXXXXXXXX"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 font-semibold outline-none uppercase" />
          </div>

          <!-- JUMLAH ANGGOTA KELUARGA (SETELAH NO HP) -->
          <div>
            <label class="block text-xs font-bold text-emerald-800 uppercase mb-1">JUMLAH ANGGOTA KELUARGA *</label>
            <input type="number" id="jumlah_anggota_input" required min="1" max="25" placeholder="MISAL: 4"
                   class="w-full px-3 py-2 border-2 border-emerald-500 rounded-lg focus:ring-2 focus:ring-emerald-600 font-black text-slate-800 outline-none uppercase" />
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button type="button" onclick="prosesLanjutDariWilayah()"
                  class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition text-sm uppercase">
            LANJUT KE ANGGOTA KELUARGA &rarr;
          </button>
        </div>
      </div>

      <!-- ========================================================
           HALAMAN 2: II. DATA ANGGOTA KELUARGA (HALAMAN PER ANGGOTA)
           ======================================================== -->
      <div id="area_anggota_keluarga">
        <!-- Wadah Halaman Anggota Dinamis Disisipkan oleh JS -->
      </div>

      <!-- ========================================================
           HALAMAN 3: III. BLOK KELUARGA BERENCANA
           ======================================================== -->
      <div id="hal_kb" class="halaman-form space-y-6">
        <h2 class="text-lg font-bold text-emerald-800 border-l-4 border-emerald-600 pl-3 uppercase">
          III. BLOK KELUARGA BERENCANA
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">APAKAH SEDANG HAMIL?</label>
            <select id="sedang_hamil" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="false">TIDAK</option>
              <option value="true">YA</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">USIA KEHAMILAN (MINGGU)</label>
            <input type="number" id="usia_kehamilan_minggu" min="0" max="45" placeholder="0 JIKA TIDAK HAMIL"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">SEDANG PAKAI ALAT/OBAT KB?</label>
            <select id="sedang_pakai_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="true">YA</option>
              <option value="false">TIDAK</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">JENIS KB YANG DIGUNAKAN</label>
            <select id="kode_jenis_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH JENIS KB --</option>
              <option value="1">1. MOW / STERIL WANITA</option>
              <option value="2">2. MOP / STERIL PRIA</option>
              <option value="3">3. IUD / SPIRAL</option>
              <option value="4">4. IMPLAN / SUSUK</option>
              <option value="5">5. SUNTIK</option>
              <option value="6">6. PIL</option>
              <option value="7">7. KONDOM</option>
              <option value="8">8. MAL</option>
              <option value="9">9. TRADISIONAL</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">ALASAN UTAMA TIDAK BER-KB</label>
            <select id="kode_alasan_tidak_kb" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="">-- PILIH ALASAN --</option>
              <option value="1">1. INGIN HAMIL / ANAK</option>
              <option value="2">2. TIDAK TAHU TENTANG KB</option>
              <option value="3">3. ALASAN KESEHATAN</option>
              <option value="4">4. TAKUT EFEK SAMPING</option>
              <option value="7">7. BIAYA MAHAL</option>
              <option value="9">9. SUAMI / KELUARGA MENOLAK</option>
              <option value="10">10. ALASAN AGAMA</option>
              <option value="13">13. INFERTILITAS / MENOPAUSE</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">JUMLAH ANAK HIDUP (L / P)</label>
            <div class="flex gap-2">
              <input type="number" id="jml_anak_laki" placeholder="LAKI" min="0" class="w-1/2 px-3 py-2 border rounded-lg uppercase" />
              <input type="number" id="jml_anak_perempuan" placeholder="PEREMPUAN" min="0" class="w-1/2 px-3 py-2 border rounded-lg uppercase" />
            </div>
          </div>
        </div>

        <div class="flex justify-between pt-4">
          <button type="button" onclick="bukaHalamanAnggota(totalHalamanAnggota)"
                  class="px-5 py-2.5 border border-slate-300 rounded-lg text-slate-700 font-bold uppercase hover:bg-slate-100 transition text-sm">
            &larr; KEMBALI KE ANGGOTA
          </button>
          <button type="button" onclick="pindahHalaman('hal_pembangunan', 'IV. BLOK PEMBANGUNAN KELUARGA')"
                  class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition text-sm uppercase">
            LANJUT KE PEMBANGUNAN KELUARGA &rarr;
          </button>
        </div>
      </div>

      <!-- ========================================================
           HALAMAN 4: IV. BLOK PEMBANGUNAN KELUARGA
           ======================================================== -->
      <div id="hal_pembangunan" class="halaman-form space-y-6">
        <h2 class="text-lg font-bold text-emerald-800 border-l-4 border-emerald-600 pl-3 uppercase">
          IV. BLOK PEMBANGUNAN KELUARGA
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">19. JENIS ATAP TERLUAS</label>
            <select id="kode_atap" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1">1. BETON</option>
              <option value="2" selected>2. GENTENG</option>
              <option value="3">3. ASBES / SENG</option>
              <option value="4">4. KAYU / SIRAP</option>
              <option value="5">5. BAMBU</option>
              <option value="6">6. JERAMI / IJUK</option>
              <option value="7">7. LAINNYA</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">20. JENIS DINDING TERLUAS</label>
            <select id="kode_dinding" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1" selected>1. TEMBOK</option>
              <option value="2">2. KAYU / PAPAN</option>
              <option value="3">3. SENG</option>
              <option value="4">4. BAMBU</option>
              <option value="5">5. LAINNYA</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">21. JENIS LANTAI TERLUAS</label>
            <select id="kode_lantai" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1" selected>1. KERAMIK / GRANIT / UBIN</option>
              <option value="2">2. SEMEN</option>
              <option value="3">3. KAYU / PAPAN</option>
              <option value="4">4. BAMBU</option>
              <option value="5">5. TANAH</option>
              <option value="6">6. LAINNYA</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">23. SUMBER AIR MINUM UTAMA</label>
            <select id="kode_air_minum" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1">1. AIR KEMASAN / ISI ULANG</option>
              <option value="2" selected>2. LEDENG / PDAM</option>
              <option value="3">3. SUMUR BOR</option>
              <option value="4">4. SUMUR TERLINDUNG</option>
              <option value="5">5. SUMUR TIDAK TERLINDUNG</option>
              <option value="6">6. AIR SUNGAI / DANAU</option>
              <option value="7">7. AIR HUJAN</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">24. FASILITAS JAMBAN / TEMPAT BAB</label>
            <select id="kode_jamban" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1" selected>1. YA, DENGAN SEPTIC TANK</option>
              <option value="2">2. YA, TANPA SEPTIC TANK</option>
              <option value="3">3. JAMBAN UMUM / BERSAMA</option>
              <option value="4">4. TIDAK ADA / LAINNYA</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">28. STATUS KEPEMILIKAN RUMAH</label>
            <select id="kode_kepemilikan_rumah" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
              <option value="1" selected>1. MILIK SENDIRI</option>
              <option value="2">2. KONTRAK / SEWA</option>
              <option value="3">3. BEBAS SEWA</option>
              <option value="4">4. MENUMPANG</option>
              <option value="5">5. RUMAH DINAS</option>
            </select>
          </div>
        </div>

        <div class="flex justify-between pt-4">
          <button type="button" onclick="pindahHalaman('hal_kb', 'III. BLOK KELUARGA BERENCANA')"
                  class="px-5 py-2.5 border border-slate-300 rounded-lg text-slate-700 font-bold uppercase hover:bg-slate-100 transition text-sm">
            &larr; KEMBALI KE BLOK KB
          </button>
          <button type="submit" id="btnSimpan"
                  class="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-black rounded-lg shadow-lg transition text-sm uppercase">
            SIMPAN SELURUH DATA KELUARGA
          </button>
        </div>
      </div>

    </form>
  </div>

  <script>
    // ========================================================
    // 1. KONFIGURASI SUPABASE
    // ========================================================
    const SUPABASE_URL = "https://suyeimwyswhpzymbdwiw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1eWVpbXd5c3docHp5bWJkd2l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODEzNDUsImV4cCI6MjEwNjQ1NzM0NX0.BUAMHO174gMlXKxUrVG8eqk47daD4YBntv0RPrHWYJQ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cacheWilayah = [];
    let totalHalamanAnggota = 0;

    // ========================================================
    // 2. NAVIGASI HALAMAN (WIZARD STEPPER)
    // ========================================================
    function sembunyikanSemuaHalaman() {
      document.querySelectorAll('.halaman-form').forEach(el => el.classList.remove('aktif'));
    }

    function pindahHalaman(idTarget, labelJudul) {
      sembunyikanSemuaHalaman();
      const target = document.getElementById(idTarget);
      if (target) target.classList.add('aktif');
      document.getElementById('labelTotalTahap').innerText = labelJudul.toUpperCase();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ========================================================
    // 3. MASTER WILAYAH & GENERATOR RT
    // ========================================================
    async function muatMasterWilayah() {
      try {
        const { data, error } = await supabaseClient
          .from('master_wilayah')
          .select('*')
          .order('desa', { ascending: true });

        if (error) throw error;
        cacheWilayah = data || [];

        const listProv = [...new Map(cacheWilayah.map(item => [item.kode_provinsi, item])).values()];
        const elProv = document.getElementById('provinsi');
        elProv.innerHTML = '<option value="">-- PILIH PROVINSI --</option>';
        listProv.forEach(item => {
          elProv.innerHTML += `<option value="${item.kode_provinsi}">${item.provinsi.toUpperCase()}</option>`;
        });
      } catch (err) {
        console.error("Gagal mengambil master wilayah:", err);
      }
    }

    document.getElementById('provinsi').addEventListener('change', function() {
      const kdProv = this.value;
      document.getElementById('kode_provinsi').value = kdProv;
      const elKab = document.getElementById('kabupaten');
      elKab.innerHTML = '<option value="">-- PILIH KABUPATEN --</option>';
      document.getElementById('kode_kabupaten').value = '';
      resetDropdownBerikutnya(['kecamatan', 'desa', 'dusun', 'rt']);
      if (!kdProv) { elKab.disabled = true; return; }

      const listKab = [...new Map(cacheWilayah.filter(w => w.kode_provinsi === kdProv).map(i => [i.kode_kabupaten, i])).values()];
      listKab.forEach(item => {
        elKab.innerHTML += `<option value="${item.kode_kabupaten}">${item.kabupaten.toUpperCase()}</option>`;
      });
      elKab.disabled = false;
    });

    document.getElementById('kabupaten').addEventListener('change', function() {
      const kdKab = this.value;
      document.getElementById('kode_kabupaten').value = kdKab;
      const elKec = document.getElementById('kecamatan');
      elKec.innerHTML = '<option value="">-- PILIH KECAMATAN --</option>';
      document.getElementById('kode_kecamatan').value = '';
      resetDropdownBerikutnya(['desa', 'dusun', 'rt']);
      if (!kdKab) { elKec.disabled = true; return; }

      const listKec = [...new Map(cacheWilayah.filter(w => w.kode_kabupaten === kdKab).map(i => [i.kode_kecamatan, i])).values()];
      listKec.forEach(item => {
        elKec.innerHTML += `<option value="${item.kode_kecamatan}">${item.kecamatan.toUpperCase()}</option>`;
      });
      elKec.disabled = false;
    });

    document.getElementById('kecamatan').addEventListener('change', function() {
      const kdKec = this.value;
      document.getElementById('kode_kecamatan').value = kdKec;
      const elDesa = document.getElementById('desa');
      elDesa.innerHTML = '<option value="">-- PILIH DESA --</option>';
      document.getElementById('kode_desa').value = '';
      resetDropdownBerikutnya(['dusun', 'rt']);
      if (!kdKec) { elDesa.disabled = true; return; }

      const listDesa = [...new Map(cacheWilayah.filter(w => w.kode_kecamatan === kdKec).map(i => [i.kode_desa, i])).values()];
      listDesa.forEach(item => {
        elDesa.innerHTML += `<option value="${item.kode_desa}">${item.desa.toUpperCase()}</option>`;
      });
      elDesa.disabled = false;
    });

    document.getElementById('desa').addEventListener('change', function() {
      const kdDesa = this.value;
      document.getElementById('kode_desa').value = kdDesa;
      const elDusun = document.getElementById('dusun');
      elDusun.innerHTML = '<option value="">-- PILIH DUSUN --</option>';
      document.getElementById('kode_dusun').value = '';
      resetDropdownBerikutnya(['rt']);
      if (!kdDesa) { elDusun.disabled = true; return; }

      const listDusun = cacheWilayah.filter(w => w.kode_desa === kdDesa);
      listDusun.forEach(item => {
        elDusun.innerHTML += `<option value="${item.kode_dusun}" data-rt="${item.jumlah_rt || 0}">${item.dusun.toUpperCase()}</option>`;
      });
      elDusun.disabled = false;
    });

    document.getElementById('dusun').addEventListener('change', function() {
      const kdDusun = this.value;
      document.getElementById('kode_dusun').value = kdDusun;
      const elRt = document.getElementById('rt');
      elRt.innerHTML = '<option value="">-- PILIH RT --</option>';
      if (!kdDusun) { elRt.disabled = true; return; }

      const selectedOpt = this.options[this.selectedIndex];
      const jumlahRt = parseInt(selectedOpt.getAttribute('data-rt')) || 0;
      if (jumlahRt > 0) {
        for (let i = 1; i <= jumlahRt; i++) {
          const formattedRt = String(i).padStart(3, '0');
          elRt.innerHTML += `<option value="${formattedRt}">RT ${formattedRt}</option>`;
        }
      } else {
        elRt.innerHTML += `<option value="001">RT 001</option>`;
      }
      elRt.disabled = false;
    });

    function resetDropdownBerikutnya(ids) {
      ids.forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = `<option value="">-- PILIH ${id.toUpperCase()} --</option>`;
        el.disabled = true;
      });
    }

    // ========================================================
    // 4. GENERATOR HALAMAN ANGGOTA KELUARGA (HALAMAN SENDIRI-SENDIRI)
    // ========================================================
    function prosesLanjutDariWilayah() {
      const noKK = document.getElementById('nomor_kk').value.trim();
      const kdDusun = document.getElementById('kode_dusun').value.trim();
      const rt = document.getElementById('rt').value.trim();
      const alamat = document.getElementById('alamat_detail').value.trim();
      const noHp = document.getElementById('no_hp').value.trim();
      const jmlAnggota = parseInt(document.getElementById('jumlah_anggota_input').value) || 0;

      if (!noKK || !kdDusun || !rt || !alamat || !noHp) {
        alert("MOHON LENGKAPI SELURUH ISIAN IDENTITAS WILAYAH TERLEBIH DAHULU!");
        return;
      }

      if (jmlAnggota < 1) {
        alert("JUMLAH ANGGOTA KELUARGA MINIMAL 1 ORANG!");
        return;
      }

      // Generate halaman anggota sesuai jumlah yang diisi
      const container = document.getElementById('area_anggota_keluarga');
      container.innerHTML = '';
      totalHalamanAnggota = 0;

      for (let i = 1; i <= jmlAnggota; i++) {
        tambahHalamanAnggotaBaru();
      }

      // Buka halaman Anggota #1
      bukaHalamanAnggota(1);
    }

    function tambahHalamanAnggotaBaru() {
      totalHalamanAnggota++;
      const no = totalHalamanAnggota;
      const container = document.getElementById('area_anggota_keluarga');

      const hal = document.createElement('div');
      hal.id = `hal_anggota_${no}`;
      hal.className = "halaman-form space-y-6 item-anggota-page";
      hal.setAttribute('data-urutan', no);

      hal.innerHTML = `
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h2 class="text-lg font-black text-emerald-800 uppercase">
              II. DATA ANGGOTA KELUARGA (${no} DARI <span class="total-anggota-display">${totalHalamanAnggota}</span>)
            </h2>
            <p class="text-xs text-slate-500 uppercase font-semibold">LEMBAR ISIAN ANGGOTA KE-${no}</p>
          </div>
          <button type="button" onclick="hapusHalamanAnggota(${no})"
                  class="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white border border-rose-200 rounded-lg text-xs font-bold uppercase transition">
            HAPUS ANGGOTA INI
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs">
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">NAMA LENGKAP *</label>
            <input type="text" name="nama_lengkap" required placeholder="NAMA LENGKAP" class="w-full p-2.5 border rounded-lg uppercase" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">NIK *</label>
            <input type="text" name="nik" required maxlength="16" placeholder="16 DIGIT NIK" class="w-full p-2.5 border rounded-lg uppercase font-semibold" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">HUBUNGAN DENGAN KK *</label>
            <select name="hubungan_dengan_kk" class="w-full p-2.5 border rounded-lg uppercase">
              <option value="1" ${no === 1 ? 'selected' : ''}>1. KEPALA KELUARGA</option>
              <option value="2" ${no === 2 ? 'selected' : ''}>2. ISTRI</option>
              <option value="3" ${no > 2 ? 'selected' : ''}>3. ANAK</option>
              <option value="4">4. LAINNYA</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">JENIS KELAMIN *</label>
            <select name="jenis_kelamin" class="w-full p-2.5 border rounded-lg uppercase">
              <option value="1">1. LAKI-LAKI</option>
              <option value="2">2. PEREMPUAN</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">TANGGAL LAHIR *</label>
            <input type="date" name="tanggal_lahir" required class="w-full p-2.5 border rounded-lg uppercase" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">STATUS PERKAWINAN</label>
            <select name="status_perkawinan" class="w-full p-2.5 border rounded-lg uppercase">
              <option value="1">1. BELUM KAWIN</option>
              <option value="2">2. KAWIN</option>
              <option value="3">3. CERAI HIDUP</option>
              <option value="4">4. CERAI MATI</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">MEMILIKI AKTA LAHIR?</label>
            <select name="memiliki_akta_lahir" class="w-full p-2.5 border rounded-lg uppercase">
              <option value="1">1. YA</option>
              <option value="2">2. TIDAK</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-bold uppercase">KEPESERTAAN JKN</label>
            <select name="kepesertaan_jkn" class="w-full p-2.5 border rounded-lg uppercase">
              <option value="1">1. BPJS PBI</option>
              <option value="2">2. BPJS NON-PBI</option>
              <option value="3">3. SWASTA</option>
              <option value="4">4. TIDAK MEMILIKI</option>
            </select>
          </div>
        </div>

        <div class="flex justify-between pt-6 border-t">
          <button type="button" onclick="mundurDariAnggota(${no})"
                  class="px-5 py-2.5 border border-slate-300 rounded-lg text-slate-700 font-bold uppercase hover:bg-slate-100 transition text-sm">
            &larr; SEBELUMNYA
          </button>
          <button type="button" onclick="majuDariAnggota(${no})"
                  class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition text-sm uppercase">
            LANJUTKAN &rarr;
          </button>
        </div>
      `;

      container.appendChild(hal);
      perbaruiLabelTotalAnggota();
    }

    function perbaruiLabelTotalAnggota() {
      document.querySelectorAll('.total-anggota-display').forEach(span => {
        span.innerText = totalHalamanAnggota;
      });
      document.getElementById('jumlah_anggota_input').value = totalHalamanAnggota;
    }

    function bukaHalamanAnggota(noUrut) {
      pindahHalaman(`hal_anggota_${noUrut}`, `ANGGOTA KELUARGA #${noUrut}`);
      document.getElementById('badgeLangkah').innerText = `ANGGOTA #${noUrut}`;
    }

    function mundurDariAnggota(noUrut) {
      if (noUrut === 1) {
        pindahHalaman('hal_wilayah', 'I. IDENTITAS WILAYAH');
        document.getElementById('badgeLangkah').innerText = "LANGKAH 1";
      } else {
        bukaHalamanAnggota(noUrut - 1);
      }
    }

    function majuDariAnggota(noUrut) {
      const pageEl = document.getElementById(`hal_anggota_${noUrut}`);
      const nama = pageEl.querySelector('[name="nama_lengkap"]').value.trim();
      const nik = pageEl.querySelector('[name="nik"]').value.trim();
      const tgl = pageEl.querySelector('[name="tanggal_lahir"]').value;

      if (!nama || !nik || !tgl) {
        alert("LENGKAPI NAMA, NIK, DAN TANGGAL LAHIR PADA ANGGOTA INI TERLEBIH DAHULU!");
        return;
      }

      // Jika anggota terakhir diisi
      if (noUrut === totalHalamanAnggota) {
        const konfirmasi = confirm("Apakah seluruh anggota keluarga telah terisi?");
        if (konfirmasi) {
          // Klik YA: Lanjut ke Blok KB
          pindahHalaman('hal_kb', 'III. BLOK KELUARGA BERENCANA');
          document.getElementById('badgeLangkah').innerText = "LANGKAH 3";
        } else {
          // Klik TIDAK: Buat halaman anggota baru & buka
          tambahHalamanAnggotaBaru();
          bukaHalamanAnggota(totalHalamanAnggota);
        }
      } else {
        bukaHalamanAnggota(noUrut + 1);
      }
    }

    function hapusHalamanAnggota(noUrut) {
      if (totalHalamanAnggota <= 1) {
        alert("MINIMAL HARUS ADA 1 ANGGOTA KELUARGA!");
        return;
      }

      if (confirm(`YAKIN INGIN MENGHAPUS DATA ANGGOTA KE-${noUrut}?`)) {
        const el = document.getElementById(`hal_anggota_${noUrut}`);
        if (el) el.remove();

        // Susun ulang ID elemen yang tersisa
        const sisaHalaman = document.querySelectorAll('.item-anggota-page');
        totalHalamanAnggota = sisaHalaman.length;

        sisaHalaman.forEach((hal, idx) => {
          const indexBaru = idx + 1;
          hal.id = `hal_anggota_${indexBaru}`;
          hal.setAttribute('data-urutan', indexBaru);
          hal.querySelector('h2').innerHTML = `II. DATA ANGGOTA KELUARGA (${indexBaru} DARI <span class="total-anggota-display">${totalHalamanAnggota}</span>)`;
          hal.querySelector('p').innerText = `LEMBAR ISIAN ANGGOTA KE-${indexBaru}`;
          hal.querySelector('button[onclick*="hapusHalamanAnggota"]').setAttribute('onclick', `hapusHalamanAnggota(${indexBaru})`);
          hal.querySelector('button[onclick*="mundurDariAnggota"]').setAttribute('onclick', `mundurDariAnggota(${indexBaru})`);
          hal.querySelector('button[onclick*="majuDariAnggota"]').setAttribute('onclick', `majuDariAnggota(${indexBaru})`);
        });

        perbaruiLabelTotalAnggota();

        // Tampilkan halaman terdekat
        const targetBuka = noUrut > totalHalamanAnggota ? totalHalamanAnggota : noUrut;
        bukaHalamanAnggota(targetBuka);
      }
    }

    window.addEventListener('DOMContentLoaded', muatMasterWilayah);

    // ========================================================
    // 5. SUBMIT SELURUH FORM KE SUPABASE
    // ========================================================
    document.getElementById('pendataanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSimpan = document.getElementById('btnSimpan');
      btnSimpan.disabled = true;
      btnSimpan.innerText = "MENYIMPAN KE DATABASE...";

      try {
        const noKK = document.getElementById('nomor_kk').value.trim();
        const kdDusun = document.getElementById('kode_dusun').value.trim();
        const rt = document.getElementById('rt').value.trim();
        const alamat = document.getElementById('alamat_detail').value.trim().toUpperCase();
        const noHp = document.getElementById('no_hp').value.trim();

        // 1. Kumpulkan Data Anggota Keluarga dari semua halaman anggota
        const listHalAnggota = document.querySelectorAll('.item-anggota-page');
        const payloadAnggota = [];

        listHalAnggota.forEach((hal, idx) => {
          payloadAnggota.push({
            nomor_kk: noKK,
            kode_dusun: kdDusun,
            rt: rt,
            alamat_detail: alamat,
            nomor_urut_anggota: idx + 1,
            nama_lengkap: hal.querySelector('[name="nama_lengkap"]').value.trim().toUpperCase(),
            nik: hal.querySelector('[name="nik"]').value.trim(),
            jenis_kelamin: hal.querySelector('[name="jenis_kelamin"]').value,
            tanggal_lahir: hal.querySelector('[name="tanggal_lahir"]').value,
            status_perkawinan: hal.querySelector('[name="status_perkawinan"]').value,
            memiliki_akta_lahir: hal.querySelector('[name="memiliki_akta_lahir"]').value,
            hubungan_dengan_kk: hal.querySelector('[name="hubungan_dengan_kk"]').value,
            agama: '1',
            status_pekerjaan: '1',
            pendidikan_terakhir: '4',
            kepesertaan_jkn: hal.querySelector('[name="kepesertaan_jkn"]').value,
            keberadaan_anggota: '1'
          });
        });

        // 2. Simpan Anggota Keluarga (Trigger membuat baris KK secara otomatis)
        const { error: errAnggota } = await supabaseClient
          .from('anggota_keluarga')
          .insert(payloadAnggota);

        if (errAnggota) throw errAnggota;

        // 3. Update Detail Kondisi Rumah di tabel kartu_keluarga
        const payloadKondisiRumah = {
          kode_atap: document.getElementById('kode_atap').value,
          kode_dinding: document.getElementById('kode_dinding').value,
          kode_lantai: document.getElementById('kode_lantai').value,
          kode_air_minum: document.getElementById('kode_air_minum').value,
          kode_jamban: document.getElementById('kode_jamban').value,
          kode_kepemilikan_rumah: document.getElementById('kode_kepemilikan_rumah').value,
          diperbarui_pada: new Date()
        };

        const { data: kkData, error: errKkUpdate } = await supabaseClient
          .from('kartu_keluarga')
          .update(payloadKondisiRumah)
          .eq('nomor_kk', noKK)
          .select('id')
          .single();

        if (errKkUpdate) throw errKkUpdate;

        // 4. Simpan Data Blok KB
        const payloadKB = {
          kartu_keluarga_id: kkData.id,
          sedang_hamil: document.getElementById('sedang_hamil').value === 'true',
          usia_kehamilan_minggu: parseInt(document.getElementById('usia_kehamilan_minggu').value) || 0,
          sedang_pakai_kb: document.getElementById('sedang_pakai_kb').value === 'true',
          kode_jenis_kb: document.getElementById('kode_jenis_kb').value || null,
          kode_alasan_tidak_kb: document.getElementById('kode_alasan_tidak_kb').value || null,
          jml_anak_masih_hidup_laki: parseInt(document.getElementById('jml_anak_laki').value) || 0,
          jml_anak_masih_hidup_perempuan: parseInt(document.getElementById('jml_anak_perempuan').value) || 0
        };

        const { error: errKB } = await supabaseClient
          .from('keluarga_berencana_pus')
          .insert([payloadKB]);

        if (errKB) throw errKB;

        alert('SELURUH DATA KELUARGA BERHASIL DISIMPAN KE SISTEM!');
        location.reload();

      } catch (err) {
        console.error(err);
        alert('GAGAL MENYIMPAN DATA: ' + (err.message || JSON.stringify(err)));
      } finally {
        btnSimpan.disabled = false;
        btnSimpan.innerText = "SIMPAN SELURUH DATA KELUARGA";
      }
    });
  </script>
</body>
</html>
